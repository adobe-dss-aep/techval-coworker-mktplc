name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test modular skill structure and contracts
        run: node --test tests/skills.test.cjs
      - name: Validate marketplace with Claude Code
        run: npx --yes --package=@anthropic-ai/claude-code@2.1.233 claude plugin validate .
      - name: Validate secur-csc-fsi plugin
        run: npx --yes --package=@anthropic-ai/claude-code@2.1.233 claude plugin validate ./plugins/secur-csc-fsi
      - name: Validate Secur Financial CX placeholder
        run: npx --yes --package=@anthropic-ai/claude-code@2.1.233 claude plugin validate ./plugins/secur-financial-cx
      - name: Validate Hands On Labs - AJO placeholder
        run: npx --yes --package=@anthropic-ai/claude-code@2.1.233 claude plugin validate ./plugins/hands-on-labs-ajo
